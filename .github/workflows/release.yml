name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write     # creating the GitHub release
  id-token: write     # OIDC token for NuGet trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    # Protected environment with a required reviewer. Publishing to nuget.org is
    # irreversible — a package version can be unlisted but never deleted — so the
    # deployment waits for an explicit approval.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/EFactura.Net.Client

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the tag to derive the package version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      # The full suite runs again here rather than trusting the CI run on the commit:
      # a tag can be placed on any commit, including one CI never saw.
      - run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Show what is about to be published
        run: |
          ls -la artifacts/
          echo "Tag: ${{ github.ref_name }}"

      # Trusted publishing: exchanges the job's OIDC token for a short-lived API key,
      # so no long-lived nuget.org key is ever stored in GitHub.
      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        # .snupkg symbol packages are pushed automatically alongside their .nupkg.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --verify-tag
