name: Bug report
description: Something this library does is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** please replace any real CUI, IBAN, company name or CNP in
        anything you paste. A rejected document reproduces just as well with
        `RO12345674` and `Furnizor Test SRL`.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - EFactura.Net.Ubl
        - EFactura.Net.Client
        - both / not sure
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations: { required: true }

  - type: input
    id: tfm
    attributes:
      label: Target framework
      placeholder: "net8.0 / net10.0"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest piece of code that shows it. Synthetic data only.
      render: csharp
    validations: { required: true }

  - type: input
    id: anaf-rule
    attributes:
      label: ANAF rule code, if ANAF rejected a document
      placeholder: "BR-CO-25, UBL-CR-429, ERRIdentif, ..."

  - type: textarea
    id: anaf-message
    attributes:
      label: ANAF's message, verbatim
      description: >
        From `result.Errors` or `RawResponse`. Check it for counterparty identifiers
        before pasting.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I replaced every real identifier with a synthetic one.
          required: true
        - label: I ran `ValidateAsync` and included what it said, if this is about a rejected document.
